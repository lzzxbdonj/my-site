# StudyMate AI 代理 Worker 配置
# 部署前请阅读 worker/README.md：需要设置非机密变量（这里）与机密（wrangler secret put）。
name = "studymate-ai-proxy"
main = "src/index.js"
compatibility_date = "2026-01-01"
# 默认开启 workers.dev 子域，部署后立刻有一个可调用的 HTTPS 地址；
# 想用自定义域就设为 false 并配置下面的 routes。
workers_dev = true

# 自定义域示例（把注释去掉并改成你自己的域名与区域）：
# routes = [
#   { pattern = "api.example.com/*", zone_name = "example.com" },
# ]

# 非机密变量：按你的实际情况修改
[vars]
ENVIRONMENT = "production"
# 固定服务端 HTTPS 端点（OpenAI 兼容），客户端无法指定目标
PROVIDER_BASE_URL = "https://api.deepseek.com"
PROVIDER_MODEL = "deepseek-chat"
# 允许调用本 Worker 的前端源，逗号分隔，必须与浏览器地址栏的源完全一致（只写源，不要带仓库路径）
# 两个源都要登记：GitHub Pages 与 Cloudflare Pages；登录回跳（returnTo）也只会落在这些源上
ALLOWED_ORIGINS = "https://lzzxbdonj.github.io,https://ai-zixuetong.pages.dev"
# 额度：项目选定的默认值（200 次/访客/天，800 次/全站/天），不是用户指定值，可自行调整
# 单位是「模型调用次数」：按节生成下一个知识点约 5 次，一门 7 知识点的课约 36 次
VISITOR_DAILY_LIMIT = "200"
SITE_DAILY_LIMIT = "800"
PROVIDER_TIMEOUT_MS = "90000"
PROVIDER_MAX_OUTPUT_TOKENS = "8000"
MAX_REQUEST_BYTES = "20000"
MAX_PROVIDER_RESPONSE_BYTES = "262144"
MAX_CONCURRENT_PROVIDER_REQUESTS = "2"
RESERVATION_TTL_MS = "180000"

# ---- GitHub 登录（可选）----
# 三个变量必须同时设置才会启用登录；缺任意一个，登录端点返回 503，但 AI 建课等既有能力不受影响。
# ⚠️ 回调地址走 Pages 反代（不是 workers.dev）——因为 workers.dev 在部分网络被封锁，
#    而 Pages 反代会把 /api/* 转发到本 Worker。
GITHUB_CLIENT_ID = "Ov23liHSjVkYKmIdrSDy"
AUTH_REDIRECT_URI = "https://ai-zixuetong.pages.dev/api/auth/callback"
#   必须与 GitHub OAuth App 里填的 Authorization callback URL 完全一致；不设置则按请求来源自动推导。

# 机密（不要写在此文件里，用 wrangler secret put 设置）：
#   PROVIDER_API_KEY   供应商密钥
#   IP_SALT            用于对访客 IP 加盐哈希的随机串（≥16 位）
#   GITHUB_CLIENT_SECRET  GitHub OAuth App 的 Client Secret（仅启用登录时需要）
#   AUTH_TOKEN_SECRET     给会话令牌签名的随机串（≥32 位；更换它可让所有旧令牌立即失效）

# 原子配额使用 Durable Object；首次部署需要迁移声明
[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiter"

# 按账号的信用点账本（收费前置）：一个账号一个实例，保证扣费原子且幂等
[[durable_objects.bindings]]
name = "ACCOUNT_LEDGER"
class_name = "AccountLedger"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RateLimiter"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["AccountLedger"]